    <meta name="theme-color" content="#0f0f14" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OpenOnyx" />
    <meta property="og:title" content="OpenOnyx — Local-First AI Knowledge Management" />
    <meta
      property="og:description"
      content="OpenOnyx is an open-source, local-first knowledge management app. Connect Markdown notes, explore knowledge graphs, and ask your own files with optional AI tools."
    />
    <meta
      property="og:image"
      content="https://openonyx.app/images/banner.webp"
    />

    <meta property="og:image:height" content="727" />
    <meta property="og:image:alt" content="OpenOnyx — open-source knowledge management" />
    <meta property="og:url" content="https://openonyx.app/" />

      name="twitter:description"
      content="OpenOnyx is an open-source, local-first knowledge management app. Connect Markdown notes, explore knowledge graphs, and ask your own files with optional AI tools."

    <meta
      name="twitter:image"

    <meta name="twitter:image:alt" content="OpenOnyx — open-source knowledge management" />
    <title>OpenOnyx — Local-First AI Knowledge Management</title>
    <script>
      try {
        var t = localStorage.getItem("openonyx-theme");
        if (t !== "light" && t !== "dark") {
          t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.dataset.theme = t;
        document.documentElement.style.colorScheme = t;
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
